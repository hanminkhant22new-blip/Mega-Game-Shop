<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGA GAME SHOP</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07130d;
  color:white;
}
header{
  padding:25px 15px;
  text-align:center;
  background:linear-gradient(135deg,#00a86b,#063b28);
}
header h1{
  margin:0;
  font-size:32px;
}
header p{margin:8px 0 0}
.container{
  padding:20px;
  max-width:600px;
  margin:auto;
}
.card{
  background:#10251b;
  border:1px solid #1d6244;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
}
.game{
  width:100%;
  padding:18px;
  margin:8px 0;
  border:0;
  border-radius:12px;
  background:#123d2b;
  color:white;
  font-size:18px;
  font-weight:bold;
}
.game:active{transform:scale(.98)}
.hidden{display:none}
.package{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0b1c14;
  padding:13px;
  margin:8px 0;
  border-radius:10px;
}
.package button{
  background:#00b875;
  color:white;
  border:0;
  border-radius:8px;
  padding:9px 14px;
}
input,select{
  width:100%;
  padding:13px;
  margin:7px 0 12px;
  border-radius:9px;
  border:1px solid #287653;
  background:#07130d;
  color:white;
}
.submit{
  width:100%;
  padding:15px;
  background:#00b875;
  color:white;
  border:0;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
}
.back{
  background:#444;
  margin-bottom:12px;
}
#result{
  text-align:center;
  background:#123d2b;
  padding:20px;
  border-radius:15px;
}
</style>
</head>

<body>

<header>
  <h1>MEGA GAME SHOP</h1>
  <p>Game Top Up Service</p>
</header>

<div class="container">

<div id="home" class="card">
  <h2> Game ရွေးပါ</h2>

  <button class="game" onclick="selectGame('Mobile Legends')">
     Mobile Legends
  </button>

  <button class="game" onclick="selectGame('PUBG Mobile')">
     PUBG Mobile
  </button>

  <button class="game" onclick="selectGame('Magic Chess Go Go')">
     Magic Chess Go Go
  </button>

  <button class="game" onclick="selectGame('MLBB Ban Server')">
     Mobile Legends Ban Server
  </button>
</div>

<div id="packages" class="card hidden">
  <button class="game back" onclick="goHome()"> နောက်သို့</button>

  <h2 id="gameTitle"></h2>
  <div id="packageList"></div>
</div>

<div id="order" class="card hidden">
  <button class="game back" onclick="backPackages()"> နောက်သို့</button>

  <h2> Order တင်ရန်</h2>

  <p id="selectedPackage"></p>

  <label>Game ID</label>
  <input id="gameId" placeholder="Game ID ထည့်ပါ">

  <label>Server ID</label>
  <input id="serverId" placeholder="Server ID ထည့်ပါ">

  <label>Payment Method</label>
  <select id="payment">
    <option>KBZPay</option>
    <option>WavePay</option>
  </select>

  <label>ငွေလွှဲပြေစာ Screenshot</label>
  <input id="receipt" type="file" accept="image/*">

  <button class="submit" onclick="submitOrder()">
     Order တင်မည်
  </button>
</div>

<div id="result" class="hidden"></div>

</div>
